const S=[{t:'Frame the Mission',q:[mc('Which model family suits ordinary numeric tabular inputs?',['Fully connected network','CNN','LSTM','Clustering'],0,'Use a feed-forward dense network.')]},{t:'Inspect & Clean',q:[cd('Load the dataset.','df = pd.____("dataset.csv")',['read_csv'],'Use the pandas CSV reader.','pd.read_csv loads a CSV into a DataFrame.'),cd('Inspect shape and missing data.','print(df.____)\nprint(df.____().sum())',['shape','isna'],'One is an attribute and one detects missing values.'),cd('Clean and reset index.','df=df.____().____()\ndf=df.____(drop=True)',['dropna','drop_duplicates','reset_index'],'Remove missing and duplicate rows, then rebuild the index.')]},{t:'Split Without Leakage',q:[cd('Remove both target columns from X.','X=df.____(columns=["target_col_A","target_col_B"])\ny=df[["target_col_A","target_col_B"]]',['drop'],'The targets belong in y, not X.'),cd('Requirement: reserve 30% as a temporary hold-out set. Complete test_size.','train_test_split(X,y,test_size=____,random_state=42)',['0.3'],'30% written as a proportion is 0.3.','test_size is the proportion or count assigned to the hold-out subset.'),cd('Scale without leakage.','X_train_s=scaler.____(X_train)\nX_val_s=scaler.____(X_val)',['fit_transform','transform'],'Only fit using training data.')]},{t:'Build a Baseline',q:[cd('Complete hidden activations.','layers.Dense(32,activation="____")\nlayers.Dense(16,activation="____")',['relu','relu'],'ReLU is a common hidden activation.'),cd('Requirement: train for 100 epochs with batch size 32.','model.____(X_train_s,y_train,epochs=____,batch_size=____)',['fit','100','32'],'Use model.fit with the stated numbers.','epochs is the maximum number of dataset passes; batch_size is samples per update.')]},{t:'Optimise',q:[cd('Add dropout.','layers.____(0.2)',['Dropout'],'Dropout randomly masks activations.'),cd('Add L2 regularisation.','keras.regularizers.____(1e-4)',['l2'],'Use Keras L2 regularisation.'),cd('Requirement: stop after 20 epochs with no validation improvement and restore the best weights. Complete EarlyStopping.','EarlyStopping(monitor="val_loss",patience=____,restore_best_weights=____)',['20','True'],'The requirement directly specifies patience=20 and restoration of the best weights.','EarlyStopping patience is the number of epochs with no improvement tolerated before stopping.') ]},{t:'Evaluate',q:[mc('Which data should select between candidate models?',['Validation data','Test data','Training only','Deployment data'],0,'Keep test data untouched during model selection.'),cd('Generate predictions.','y_pred=model.____(X_test_s,verbose=0)',['predict'],'Use inference, not fit.')]},{t:'Deploy & Infer',q:[cd('Save the model.','model.____("model.keras")',['save'],'Use Keras model persistence.'),cd('Reload preprocessing and infer.','scaler2=joblib.____("scaler.joblib")\nnew_s=scaler2.____(new_df)\ny_new=model.____(new_s,verbose=0)',['load','transform','predict'],'Reload, transform, then predict.')] }];
function mq(st){if(st===0){if(mission.id==='reg')return[mc('Correct output/loss?',['Linear + MSE','Sigmoid + BCE','Softmax + crossentropy','ReLU + accuracy'],0,'Continuous regression uses a linear output.')];if(mission.id==='bin')return[cd('Complete the binary output.','layers.Dense(1,activation="____")',['sigmoid'],'Sigmoid maps output to 0–1.')];return[cd('Complete the four-class output.','layers.Dense(4,activation="____")',['softmax'],'Softmax creates class probabilities.')]}if(st===5){if(mission.id==='reg')return[cd('Compute RMSE.','rmse=np.____(np.mean((y_test-y_pred)**2))',['sqrt'],'Take the square root of MSE.')];if(mission.id==='bin')return[mc('Probability 0.73 with threshold 0.5 predicts?',['Class 1','Class 0','Both','Neither'],0,'0.73 is above 0.5.')];return[mc('For [0.08,0.12,0.65,0.15], predicted class index?',['2','0','1','3'],0,'Choose the largest probability.')]}return[]}

function tone(freq,dur,type='sine',vol=.055,delay=0){if(!soundOn)return;ensureAudio();if(!audioCtx)return;let o=audioCtx.createOscillator(),g=audioCtx.createGain(),t=audioCtx.currentTime+delay;o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur+.03)}
function correctSound(){tone(660,.10,'sine',.05);tone(880,.13,'sine',.045,.07)}function wrongSound(){tone(180,.17,'sawtooth',.035);tone(120,.20,'sawtooth',.03,.06)}function milestoneSound(){[523,659,784].forEach((f,i)=>tone(f,.17,'sine',.045,i*.09))}function victorySound(){[523,659,784,1047].forEach((f,i)=>tone(f,.22,'sine',.05,i*.11))}

function renderPrecheck(){rainActive=true;document.getElementById('map').style.display='none';document.getElementById('sn').textContent='Pre';document.getElementById('fill').style.width='0%';game.innerHTML=`<section class="precheck"><div class="rainTop"><div><h2 style="margin:0">🌧️ Pre-Check · Keyword Rain</h2><p style="margin:6px 0;color:#b9d7ea">Click real Deep Learning / Python keywords. Avoid plausible impostors. Reach <b>50</b> to unlock Stage 0.</p></div><button class="soundBtn" id="soundBtn" onclick="toggleSound()">🔊 Sound ON</button></div><div class="rainTop"><b>Keyword Score: <span id="kScore">0</span> / 50</b><span class="milestone" id="kStatus">${rainStatus()}</span><div class="preProgress"><div id="kProg" style="width:0%"></div></div></div><div class="rainArena" id="rainArena" onclick="ensureAudio()"></div></section>`;scheduleRain()}

function spawnWord(){if(!rainActive)return;let arena=document.getElementById('rainArena');if(!arena)return;let good=Math.random()<.57,pool=good?KEYWORDS:DISTRACTORS,word=pool[Math.floor(Math.random()*pool.length)],el=document.createElement('button');el.className='rainWord';el.textContent=word;el.dataset.good=good?'1':'0';let max=Math.max(10,arena.clientWidth-260);el.style.left=(10+Math.random()*max)+'px';let duration=(6.0+Math.random()*3.4)*(1-Math.min(keywordScore,45)*.005);el.style.animationDuration=duration+'s';el.onclick=e=>{e.stopPropagation();hitWord(el,e)};el.onanimationend=()=>el.remove();arena.appendChild(el)}

function hitWord(el,e){if(el.dataset.hit)return;el.dataset.hit='1';ensureAudio();let good=el.dataset.good==='1',before=keywordScore;if(good){keywordScore=Math.min(50,keywordScore+1);keywordStreak++;el.classList.add('goodHit');floatPoints(el,'+1','#71f0ad');correctSound()}else{keywordScore=Math.max(0,keywordScore-1);keywordStreak=0;el.classList.add('badHit');floatPoints(el,'−1','#ff7582');wrongSound();let arena=document.getElementById('rainArena');arena.classList.remove('arenaFlash');void arena.offsetWidth;arena.classList.add('arenaFlash')}updateRainHUD(before);setTimeout(()=>el.remove(),430);if(keywordScore>=50)completeRain()}

function dragEnd(e){dragFrom=-1;document.querySelectorAll('.sortItem').forEach(x=>x.classList.remove('dragging','dragover'))}

function checkPipeline(){stage0Attempts++;let correct=pipeline.filter((x,i)=>x===PIPELINE[i]).length;if(correct===PIPELINE.length){stage0Cleared=true;let bonus=stage0Attempts===1?30:20;credits+=bonus;xp+=stage0Attempts===1?300:200;bestStreak=Math.max(bestStreak,streakCount);document.getElementById('pfeedback').className='pipelineOk';document.getElementById('pfeedback').textContent=`✓ Pipeline cleared! +${stage0Attempts===1?300:200} XP · +${stage0Attempts===1?30:20} credits. Your random mission is now unlocked.`;setTimeout(()=>{document.getElementById('map').style.display='grid';render()},700)}else{let f=document.getElementById('pfeedback');f.className='pipelineBad';f.textContent=`${correct} of 7 blocks are currently in the correct position. Reorder and try again.`}}
let cur=0,credits=0,xp=0,streakCount=0,bestStreak=0,hintsBought=0,firstTryCorrect=0,totalAnswered=0,done=new Set(),attempt={},selectedBug=-1,bossDefeated=false;function sh(a){let x=a.map((v,i)=>({v,i}));for(let i=x.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function blanks(q){let k=0;return q.code.replace(/____/g,()=>{let n=q.a[k++].length;return `<input class="blank" maxlength="${n}" size="${Math.max(3,n)}" placeholder="${'_'.repeat(n)}">`})}function letterClue(q){if(q.type!=='code')return'For code puzzles only.';return q.a.map(a=>{let x=String(a);return x.length===1?x:`${x[0]}${'_'.repeat(Math.max(0,x.length-2))}${x[x.length-1]}`}).join('  |  ')}function nav(){map.innerHTML='';S.forEach((s,i)=>{let b=document.createElement('button');b.textContent=`${i+1}. ${s.t}`;b.className=(i===cur?'on ':'')+(done.has(i)?'done':'');b.disabled=i>0&&!done.has(i-1);b.onclick=()=>{cur=i;render()};map.append(b)});fill.style.width=done.size/7*100+'%';sn.textContent=cur+1;score.textContent=credits;if(document.getElementById('xp'))document.getElementById('xp').textContent=xp;if(document.getElementById('streak'))document.getElementById('streak').textContent=streakCount}function render(){nav();let qs=[...S[cur].q,...mq(cur)],story=STORIES[mission.id],h=`<section class="card">${cur===0?`<div class="story"><span class="reward">MISSION BRIEF · 2000 XP AVAILABLE</span><h2>${story.icon} ${story.title}</h2><p>${story.brief}</p></div><div class="mission"><b>RANDOM MISSION</b><h2>${mission.name}</h2>Target: ${mission.target}<br>Output: ${mission.out}<br>Loss: ${mission.loss}</div>`:''}<h2>${S[cur].t}</h2>`;qs.forEach((q,i)=>{h+=`<div class="q" id="q${i}"><h3>${i+1}. ${q.t}</h3>${q.brief?`<div class="brief"><b>Python brief:</b> ${q.brief}</div>`:''}`;if(q.type==='mc'){h+='<div class="opts">';sh(q.o).forEach(o=>h+=`<label class="opt"><input type="radio" name="r${i}" value="${o.i}"> ${o.v}</label>`);h+='</div>'}else h+=`<div class="code">${blanks(q)}</div>`;h+=`<button class="btn secondary" onclick="buy(${i},'h',5)">Hint · 5 🪙</button>${q.type==='code'?`<button class="btn letterBtn" onclick="buy(${i},'l',10)">First + Last Letter · 10 🪙</button>`:''}<div class="hint" id="h${i}">${q.h}</div><div class="letters" id="l${i}"><b>Letter clue:</b> ${letterClue(q)}</div><div class="fb" id="f${i}"></div></div>`});h+='<button class="btn primary" onclick="check()">Check Stage</button></section>';game.innerHTML=h}function buy(i,id,cost){let e=document.getElementById(id+i);if(!e||e.style.display==='block')return;if(credits<cost){let f=document.getElementById('f'+i);f.className='fb bad';f.textContent=`You need ${cost} credits.`;return}credits-=cost;hintsBought++;streakCount=0;e.style.display='block';showToast('Clue purchased. Streak reset.');nav()}function showToast(t){let old=document.querySelector('.toast');if(old)old.remove();let d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
function renderIncident(next){pendingNext=next;let inc=INCIDENTS[incidentIndex++%INCIDENTS.length],body=`<section class="incident"><div class="kick">RANDOM INCIDENT</div><h2>${inc.icon} ${inc.title}</h2><p>${inc.text}</p>`;if(inc.debug){body+=`<div class="console">`;inc.debug.forEach((x,i)=>body+=`<button class="debugline" id="bug${i}" onclick="selectBug(${i})">${i+1}  ${x}</button>`);body+=`</div>`}else{inc.options.forEach((x,i)=>body+=`<label class="choice"><input type="radio" name="incident" value="${i}"> ${x}</label>`)}body+=`<button class="btn primary" onclick="checkIncident(${inc.answer},'${inc.explain.replaceAll("'","\\'")}',${!!inc.debug})">Resolve Incident</button><div id="ifb" class="fb"></div></section>`;game.innerHTML=body}
function selectBug(i){let e=document.getElementById('bug'+i);if(!e)return;selectedBug=i;document.querySelectorAll('.debugline').forEach(x=>x.classList.remove('selectedBug'));e.classList.add('selectedBug')}
function checkIncident(answer,explain,isDebug){let chosen=isDebug?selectedBug:+(document.querySelector('input[name=incident]:checked')?.value??-1),f=document.getElementById('ifb');if(chosen===answer){xp+=150;credits+=10;streakCount++;bestStreak=Math.max(bestStreak,streakCount);f.className='fb ok';f.textContent='✓ Incident contained! +150 XP · +10 credits. '+explain;setTimeout(()=>advanceAfterEvent(),700)}else{streakCount=0;f.className='fb bad';f.textContent='Incident unresolved. '+explain}}
function renderBoss(next){pendingNext=next;game.innerHTML=`<section class="boss"><div class="kick">STAGE BOSS</div><h2>👾 The Overfitter</h2><div class="console">Epoch 40  train_loss: 0.82  val_loss: 0.95\nEpoch 80  train_loss: 0.51  val_loss: 0.99\nEpoch 120 train_loss: 0.29  val_loss: 1.18</div><p>Choose the <b>two</b> appropriate actions.</p><label class="choice"><input type="checkbox" name="boss" value="early"> Use EarlyStopping</label><label class="choice"><input type="checkbox" name="boss" value="reg"> Add regularisation</label><label class="choice"><input type="checkbox" name="boss" value="test"> Train on the test set</label><label class="choice"><input type="checkbox" name="boss" value="epochs"> Always add more epochs</label><button class="btn primary" onclick="checkBoss()">Defeat Boss</button><div id="bossfb" class="fb"></div></section>`}
function checkBoss(){let x=[...document.querySelectorAll('input[name=boss]:checked')].map(e=>e.value).sort().join(','),f=document.getElementById('bossfb');if(x==='early,reg'){bossDefeated=true;xp+=300;credits+=25;streakCount++;bestStreak=Math.max(bestStreak,streakCount);f.className='fb ok';f.textContent='🏆 Overfitter defeated! +300 XP · +25 credits';setTimeout(()=>advanceAfterEvent(),700)}else{streakCount=0;f.className='fb bad';f.textContent='The boss survives. Select EarlyStopping and regularisation only.'}}
function advanceAfterEvent(){cur=pendingNext;render()}
function finishGame(){let rate=totalAnswered?Math.round(firstTryCorrect/totalAnswered*100):0,rank=xp>=3000?'Neural Network Engineer':xp>=2000?'Pipeline Practitioner':'Model Apprentice',ach=[];if(stage0Attempts===1)ach.push('🏆 Pipeline Master');if(hintsBought===0)ach.push('⚡ Zero Assistance');if(bestStreak>=5)ach.push('🔥 Streak Specialist');if(bossDefeated)ach.push('👾 Overfitter Slayer');game.innerHTML=`<section class="card"><div class="kick">DEPLOYMENT APPROVED</div><h2>${STORIES[mission.id].icon} ${STORIES[mission.id].title}</h2><div class="summary"><div class="stat"><b>⭐ XP</b><br>${xp}</div><div class="stat"><b>🪙 Credits</b><br>${credits}</div><div class="stat"><b>🔥 Best streak</b><br>${bestStreak}</div><div class="stat"><b>🎯 First-try rate</b><br>${rate}%</div></div><h3>Rank: ${rank}</h3>${ach.map(a=>`<div class="achievement">${a}</div>`).join('')}<button class="btn primary" onclick="location.reload()">New Random Mission</button></section>`}
function norm(x){return x.trim().replace(/["']/g,'').toLowerCase()}function check(){let qs=[...S[cur].q,...mq(cur)],all=true,gainCredits=0,gainXp=0;qs.forEach((q,i)=>{let key=`${cur}-${i}`,wasAttempted=!!attempt[key],ok;if(q.type==='mc'){let r=document.querySelector(`input[name=r${i}]:checked`);ok=!!r&&+r.value===q.a}else{let x=[...document.querySelectorAll(`#q${i} .blank`)].map(e=>norm(e.value));ok=x.length===q.a.length&&x.every((v,j)=>v===norm(q.a[j]))}let f=document.getElementById('f'+i);f.className='fb '+(ok?'ok':'bad');f.textContent=ok?'✓ Cleared':'Not yet. Try again or buy a clue.';if(!wasAttempted)totalAnswered++;if(ok&&!wasAttempted){firstTryCorrect++;streakCount++;bestStreak=Math.max(bestStreak,streakCount);let mult=streakCount>=5?2:streakCount>=3?1.5:streakCount>=2?1.2:1;gainXp+=Math.round(100*mult);gainCredits+=10;if(mult>1)showToast(`🔥 ${mult}× XP streak!`)}else if(!ok)streakCount=0;attempt[key]=true});credits+=gainCredits;xp+=gainXp;if(all){if(!done.has(cur)){credits+=20;xp+=200}done.add(cur);let next=cur+1;if(cur===4&&!bossDefeated)setTimeout(()=>renderBoss(next),400);else if(cur<6&&[1,3].includes(cur))setTimeout(()=>renderIncident(next),400);else if(cur<6)setTimeout(()=>{cur=next;render()},400);else setTimeout(finishGame,350)}nav()}
renderPrecheck();
</script></body></html>
